name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "work"]
  pull_request:
    branches: ["main", "work"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep channel-only setup to avoid unresolved pinned versions in flutter-action.
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Publish arm64 release APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-apk >/dev/null 2>&1 || \
          gh release create latest-apk \
            --title "Latest APK" \
            --notes "Automated latest arm64 release APK"
          APK_PATH="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          gh release upload latest-apk "$APK_PATH" --clobber
